<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src blob:; frame-src blob:; connect-src 'none'">
<title>Adachi健やかNet</title>
<style>
:root{
  --ink:#1c2b31; --sub:#55666d; --line:#d6dde0; --paper:#fbfcfb; --panel:#ffffff; --tint:#eef3f3;
  --brand:#18414c; --brand2:#2b6a78;
  --todo:#a65a0c; --doing:#2c6aa0; --done:#3c7a52; --alert:#a8322a;
  --radius:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{--ink:#e4ecee;--sub:#a6b6bc;--line:#33454c;--paper:#121b1f;--panel:#182429;--tint:#1f2f35;--brand:#8fc3cf;--brand2:#6aa9b8;--todo:#e7a25a;--doing:#7fb2e2;--done:#86c39b;--alert:#ec8a80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){header.top{color:#0e1a1e}}
header.top{flex-wrap:wrap}header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}header.top button,header.top nav a{white-space:nowrap}
header.top .sp{flex:1}
header.top button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;cursor:pointer}
nav.side{border-right:1px solid var(--line);padding:12px;overflow:auto;background:var(--panel)}
nav.side a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
nav.side a[aria-current="page"]{background:var(--tint);font-weight:700}
nav.side h2{font-size:12px;color:var(--sub);margin:16px 6px 6px;font-weight:700}
nav.side .pat{display:flex;justify-content:space-between;gap:6px}
nav.side .cnt{font-size:12px;background:var(--todo);color:#fff;border-radius:999px;padding:0 7px;align-self:center}
main{overflow:auto}
.notice{border:1px solid var(--line);border-left:5px solid var(--alert);background:var(--panel);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar label{font-size:13px;color:var(--sub)}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],input[type=tel],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.btn{background:var(--brand2);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#0e1a1e}}
.btn.ghost{background:transparent;color:var(--brand2);border:1px solid var(--brand2)}
.btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert)}
.btn.sm{padding:3px 10px;font-size:13px}
table.list{width:100%;border-collapse:collapse;background:var(--panel)}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.list th{font-size:13px;color:var(--sub);font-weight:700;background:var(--tint);position:sticky;top:0}
table.list th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-weight:700}
table.list tr.grp td{background:var(--tint);font-weight:700;color:var(--brand)}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--tint)}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;color:#fff;white-space:nowrap}
.st-未対応{background:var(--todo)} .st-対応中{background:var(--doing)} .st-完了{background:var(--done)}
@media (prefers-color-scheme: dark){.pill{color:#0e1a1e}}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
.phead h2{margin:0;font-size:24px}
.phead .meta{color:var(--sub);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 16px}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--brand2);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 18px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;background:var(--panel)}
legend{font-weight:700;padding:0 6px;color:var(--brand)}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:12px;color:var(--sub)}
.rowf{display:flex;gap:10px;flex-wrap:wrap}
.rowf .f{flex:1;min-width:140px}
.meds td input{width:100%}
.mail{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;min-height:60vh}
.mlist{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:auto;max-height:75vh}
.mlist .day{position:sticky;top:0;background:var(--tint);padding:6px 12px;font-weight:700;font-size:13px;color:var(--brand);border-bottom:1px solid var(--line)}
.mlist a.item{display:block;padding:9px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mlist a.item[aria-current="true"]{background:var(--tint);box-shadow:inset 4px 0 0 var(--brand2)}
.mlist .t{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.mlist .s{font-weight:700;margin:2px 0}
.mlist .w{font-size:12px;color:var(--sub)}
.mdetail{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px 18px;overflow:auto;max-height:75vh}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:10px 0}
dl.kv dt{color:var(--sub);font-size:13px}
dl.kv dd{margin:0}
.body{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px}
.signs label{display:flex;gap:8px;align-items:center}
.flag{color:var(--alert);font-weight:700}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.file{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:6px}
.file .thumb{height:110px;display:flex;align-items:center;justify-content:center;background:var(--tint);border-radius:6px;overflow:hidden}
.file .thumb img{max-width:100%;max-height:110px}
.file .nm{font-size:13px;word-break:break-all}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--sub);margin-bottom:12px}
.drop.on{border-color:var(--brand2);color:var(--brand2)}
.empty{color:var(--sub);padding:24px;text-align:center}
.adl td,.adl th{padding:5px 8px}
.small{font-size:12px;color:var(--sub)}
.right{text-align:right}
header.top nav{display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{color:inherit;text-decoration:none;padding:4px 10px;border-radius:6px}
header.top nav a[aria-current="page"]{background:rgba(255,255,255,.18);font-weight:700}
.crumb{font-size:13px;margin-bottom:4px}.crumb a{text-decoration:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.card .v{font-size:26px;font-weight:700;color:var(--brand)}.card .l{font-size:12px;color:var(--sub)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.chart h3{margin:0 0 8px;font-size:15px}
.bar{display:grid;grid-template-columns:200px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar .b{height:16px;background:var(--brand2);border-radius:3px}
.bar .bg{background:var(--tint);border-radius:3px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.ms-不足{background:var(--alert)}.ms-要注意{background:var(--todo)}.ms-充足{background:var(--done)}.ms-未設定{background:var(--sub)}
.mlist a.item.unread .s{font-weight:800}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alert);margin-right:6px}
header.top .cnt{font-size:11px;background:var(--todo);color:#fff;border-radius:999px;padding:0 6px}
#confBanner{border-left-color:var(--doing)}
.conf h2{font-size:30px}.conf .card p{margin:4px 0 0;font-size:17px}.conf .chart div{font-size:17px;margin:3px 0}
.chg{color:var(--todo);font-size:11px;margin-left:4px}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{display:none}.mail{grid-template-columns:1fr}}
@media print{nav.side,header.top,.toolbar,.tabs,.btn{display:none!important}.app{display:block}main{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Adachi健やかNet</h1>
    <nav id="topnav" aria-label="主な画面" hidden></nav>
    <span class="sp"></span>
    <span id="who" class="small" style="color:inherit"></span>
    <span id="storeStatus" class="small" style="color:inherit;opacity:.9"></span>
    <button id="btnFolder" type="button">保存先フォルダ</button>
    <button id="btnPull" type="button" hidden>フォルダから更新</button>
    <button id="btnNew" class="needlogin" type="button" hidden>患者を追加</button>
    <button id="btnExport" type="button" hidden>書き出す</button>
    <button id="btnImport" type="button" hidden>読み込む</button>
    <input id="fileImport" type="file" accept="application/json,.json,.rtc" hidden>
  </header>
  <nav class="side" aria-label="担当患者"><h2>担当患者</h2>
    <div id="sideList"></div>
  </nav>
  <main id="mainwrap" style="overflow:auto;padding:0"><div id="confBanner" class="notice" hidden style="margin:12px 22px 0"></div><div id="admWarn" class="notice" hidden style="margin:12px 22px 0"></div><div id="main" tabindex="-1" style="padding:18px 22px"></div></main>
</div>

<script>
"use strict";
/* ============ 定数 ============ */
const SIGNS=["ふらつき・転倒","ぼんやり・言動の変化","食欲低下・体重減少","便秘・下痢","眠気・不眠","排尿の変化","残薬・飲み間違い","新しい薬・中止"];
const ADL=[ // Barthel Index（Mahoney & Barthel, 1965）
 {k:"feeding",n:"食事",o:[10,5,0]},{k:"transfer",n:"車椅子・ベッド間の移乗",o:[15,10,5,0]},{k:"grooming",n:"整容",o:[5,0]},
 {k:"toilet",n:"トイレ動作",o:[10,5,0]},{k:"bathing",n:"入浴",o:[5,0]},{k:"mobility",n:"歩行（平地）",o:[15,10,5,0]},
 {k:"stairs",n:"階段昇降",o:[10,5,0]},{k:"dressing",n:"更衣",o:[10,5,0]},{k:"bowels",n:"排便コントロール",o:[10,5,0]},{k:"bladder",n:"排尿コントロール",o:[10,5,0]}];
const STATUS=["未対応","対応中","完了"];
const RESIDENCE=["自宅（独居）","自宅（家族と同居）","サービス付き高齢者向け住宅","有料老人ホーム","グループホーム","特別養護老人ホーム","介護老人保健施設","介護医療院","障害者支援施設・グループホーム（障害）","その他"];
const CARE=["","要支援1","要支援2","要介護1","要介護2","要介護3","要介護4","要介護5","申請中","非該当","障害支援区分あり"];
const ROLES=["訪問リハビリ","訪問歯科","訪問入浴","在宅酸素（HOT）業者","腹膜透析（CAPD）業者","人工呼吸器・医療機器業者","福祉用具","訪問介護","通所介護・通所リハ","短期入所","相談支援専門員","訪問診療（専門医）","その他"];
const MATERIALS=["気管カニューレ","人工鼻","吸引カテーテル","吸引器用フィルター","人工呼吸器回路","胃ろうボタン・チューブ","経鼻胃管","経管栄養セット（ボトル・ライン）","シリンジ（カテーテルチップ）","導尿カテーテル","膀胱留置カテーテル","CAPD透析液","CAPD交換キット","酸素ボンベ","鼻カニューラ","パルスオキシメータ用プローブ","滅菌ガーゼ・固定テープ","アルコール綿","手袋"];
const GROUPS={none:"なし",doctor:"主治医",homeDoctor:"在宅医",pharmacy:"訪問薬剤師（薬局）",nursing:"訪問看護ステーション",cm:"ケアマネジャー",careLevel:"介護度",residence:"住居形態・施設"};

/* ============ IndexedDB ============ */
let db;
const PSTORES=["notes","daily","files","todos","reads","views"];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("renkei-techo",4);
 r.onupgradeneeded=()=>{const d=r.result;
  if(!d.objectStoreNames.contains("patients"))d.createObjectStore("patients",{keyPath:"id"});
  for(const s of PSTORES){if(!d.objectStoreNames.contains(s)){const o=d.createObjectStore(s,{keyPath:"id"});o.createIndex("pid","patientId")}}
  for(const s of ["members","confs","logs"])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"});
  if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta");};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);});}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const all=s=>req(tx(s).getAll());
const byPid=(s,pid)=>req(tx(s).index("pid").getAll(pid));
const get=(s,id)=>req(tx(s).get(id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const rawPut=(s,v)=>req(tx(s,"readwrite").put(v));
const rawDel=(s,id)=>req(tx(s,"readwrite").delete(id));
const metaGet=k=>req(tx("meta").get(k));
const metaPut=(k,v)=>req(tx("meta","readwrite").put(v,k));
const iso=()=>new Date().toISOString();
async function put(s,v){const isNew=STORE_JA[s]?!(await get(s,v.id)):false;v._ts=iso();if(s==="files"&&FOLDER.dir&&v.blob&&!v.path){await FOLDER.writeAttachment(v)}
 await rawPut(s,v);
 if(STORE_JA[s])audit(isNew?"create":"update",{store:s,targetId:v.id,patientId:s==="patients"?v.id:(v.patientId||""),summary:auditSummary(s,v)});
 if(s==="members")return FOLDER.saveGlobal("members",v);
 if(s==="confs")return FOLDER.saveGlobal("conferences",v);
 scheduleSync(s==="patients"?v.id:v.patientId)}
async function del(s,id){const r=await get(s,id);await rawDel(s,id);if(!r)return;
 if(STORE_JA[s])audit("delete",{store:s,targetId:id,patientId:s==="patients"?r.id:(r.patientId||""),summary:auditSummary(s,r)});
 if(s==="members"||s==="confs"){await FOLDER.removeGlobal(s==="members"?"members":"conferences",id);return}
 const pid=s==="patients"?r.id:r.patientId;
 const t=(await metaGet("del:"+pid))||{};t[id]=iso();await metaPut("del:"+pid,t);
 if(s==="files"&&FOLDER.dir&&r.path)await FOLDER.removePath(r.path).catch(()=>{});
 if(s==="patients"){await FOLDER.removePatient(pid);return}scheduleSync(pid)}
function auditSummary(s,v){return ({patients:v.name,notes:v.subject,daily:v.date,files:v.name,todos:v.title,members:v.name,confs:v.title}[s]||"")}
async function getBlob(f){if(f.blob)return f.blob;if(FOLDER.dir&&f.path){const b=await FOLDER.readPath(f.path);if(b)return new Blob([b],{type:f.type})}return null}

/* ============ 利用者・権限 ============ */
const JOBS=["医師","歯科医師","薬剤師","看護師","保健師","理学療法士","作業療法士","言語聴覚士","歯科衛生士","管理栄養士","ケアマネジャー","相談支援専門員","介護職","医療ソーシャルワーカー","福祉用具専門相談員","事務","その他"];
const TEAMST=["介入中","依頼中（開始前）","一時中断（入院など）","終了"];
let ME=null, ADMIN=false;
async function hashPw(pw,saltB64){const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
 const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256);return {salt:b64(salt),hash:b64(bits)}}
async function checkPw(pw,rec){if(!rec)return false;const h=await hashPw(pw,rec.salt);return h.hash===rec.hash}
async function loadSession(){const id=sessionStorage.getItem("rt-mid");if(!id)return;const m=await get("members",id);if(!m||m.disabled)return;ME=m;ADMIN=sessionStorage.getItem("rt-admin")==="1"&&!!m.isAdmin;if(ADMIN)adminAlive()}
function setSession(m,admin){ME=m;ADMIN=!!admin;sessionStorage.setItem("rt-mid",m.id);sessionStorage.setItem("rt-admin",admin?"1":"0")}
async function clearLocalCopy(){for(const st of ["patients","notes","daily","files","todos","reads","views","logs"]){try{await req(tx(st,"readwrite").clear())}catch(e){}}}
async function logout(){await audit("logout");try{await flushSync()}catch(e){}if(typeof flushLogs==="function"){try{await flushLogs()}catch(e){}}await clearLocalCopy();sessionStorage.removeItem("rt-mid");sessionStorage.removeItem("rt-admin-at");sessionStorage.removeItem("rt-admin");ME=null;ADMIN=false;location.hash="#/login";render()}
const myTeam=p=>(p.team||[]).find(t=>t.memberId===ME?.id);
const isConfAdmin=()=>ADMIN||!!ME?.isConfAdmin;
async function activeConfFor(pid){if(!ME)return null;return (await all("confs")).find(c=>c.active&&(c.patientIds||[]).includes(pid))||null}
function canView(p){if(!ME||!p)return false;if(ADMIN)return true;return !!myTeam(p)}
async function visiblePatients(){const ps=await all("patients");return ps.filter(canView)}
async function memberMap(){return Object.fromEntries((await all("members")).map(m=>[m.id,m]))}
async function logView(pid,via){if(!ME)return;logViewOnce(pid,via);await put("views",{id:`${pid}:${ME.id}`,patientId:pid,memberId:ME.id,at:iso(),via:via||""})}
async function markRead(note){if(!ME)return;const id=`${note.id}:${ME.id}`;if(await get("reads",id))return;await put("reads",{id,patientId:note.patientId,noteId:note.id,memberId:ME.id,at:iso()});audit("read",{store:"notes",targetId:note.id,patientId:note.patientId,summary:note.subject})}
const fmtTs=t=>{if(!t)return"";const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const pad=n=>String(n).padStart(2,"0");
function nowLocal(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
const today=()=>nowLocal().slice(0,10);
function fmtDay(s){if(!s)return"";const d=new Date(s.slice(0,10)+"T00:00");const w="日月火水木金土"[d.getDay()];return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`}
function age(b){if(!b)return"";const d=new Date(b),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a+"歳"}
function formData(form){const o={};for(const el of form.elements){if(!el.name)continue;if(el.type==="checkbox")o[el.name]=el.checked;else o[el.name]=el.value}return o}
function setNested(o,path,v){const p=path.split(".");let c=o;for(let i=0;i<p.length-1;i++){c[p[i]]=c[p[i]]||{};c=c[p[i]]}c[p[p.length-1]]=v}
function getNested(o,path){return path.split(".").reduce((c,k)=>c==null?undefined:c[k],o)}
function toast(msg){const t=document.createElement("div");t.setAttribute("role","status");t.textContent=msg;
 Object.assign(t.style,{position:"fixed",bottom:"18px",right:"18px",background:"var(--brand)",color:"#fff",padding:"8px 14px",borderRadius:"8px",zIndex:9});
 document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ============ ルーティング ============ */

function readTodo(d,team,prefix="td"){const title=(d[prefix+".title"]||"").trim();if(!title)return null;
 const act=team.filter(t=>t.status!=="終了").map(t=>t.memberId);let ids=d[prefix+".all"]?act:act.filter(id=>d[`${prefix}.m.${id}`]);
 if(!ids.length)ids=[ME.id];return {title,due:d[prefix+".due"],toAll:!!d[prefix+".all"],assignees:ids.map(id=>({memberId:id,status:"未着手",doneAt:""}))}}

  return `<tr>${showPatient?`<td><a href="#/p/${t.patientId}/todos">${esc(pm[t.patientId]?.name||"")}</a></td>`:""}<td><b>${esc(t.title)}</b>${t.noteId?`<div class="small"><a href="#/p/${t.patientId}/notes/${t.noteId}">元の連絡を開く</a></div>`:""}</td>
  <td>${esc(mm[t.from]?.name||"")}<div class="small">${esc(fmtTs(t.created))}</div></td>
  <td>${t.toAll?'<span class="small">チーム全員　</span>':""}${t.assignees.map(a=>`<span class="pill ${a.status==="完了"?"st-完了":"st-未対応"}" title="${esc(a.doneAt?fmtTs(a.doneAt):"")}">${esc(mm[a.memberId]?.name||"")}</span>`).join(" ")}</td>
  <td class="${over?"flag":""}">${esc(t.due||"")}</td>
  <td>${mine?`<button class="btn sm ${mine.status==="完了"?"ghost":""}" type="button" data-tdone="${t.id}">${mine.status==="完了"?"未完了に戻す":"完了にする"}</button>`:""}</td></tr>`}).join("")}</tbody></table>`}

function gkey(p,g){const w=(n,c)=>n?`${n}${c?`（${c}）`:""}`:"";
 const v={doctor:w(p.doctor?.name,p.doctor?.clinic),homeDoctor:w(p.homeDoctor?.name,p.homeDoctor?.clinic),pharmacy:w(p.pharmacy?.name,p.pharmacy?.pharmacist),
  nursing:p.nursing?.name,cm:w(p.cm?.name,p.cm?.office),careLevel:p.careLevel,residence:w(p.residence?.type,p.residence?.facility)}[g];return v||"（未設定）"}
function ageNum(b){if(!b)return null;const d=new Date(b),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function matStatus(m){const per=Number(m.perDay)||0,st=Number(m.stock);if(!per||m.stock===""||m.stock==null)return {s:"未設定",days:null,diff:null};
 const days=st/per;const until=m.nextDate?Math.max(0,Math.ceil((new Date(m.nextDate)-new Date(today()))/86400000)):30;
 const need=per*(until+Number(m.margin||7));const diff=Math.round((st-need)*10)/10;return {s:diff<0?"不足":days<until+14?"要注意":"充足",days:Math.floor(days),diff,need:Math.ceil(need)}}

 const q=state.q.trim();let rows=ps.filter(p=>!q||JSON.stringify(p).includes(q));
 const sk=state.sortKey;const sv=p=>sk==="name"?(p.kana||p.name):sk==="last"?(last[p.id]||""):sk==="age"?String(ageNum(p.birth)??0).padStart(3,"0"):gkey(p,sk);
 rows.sort((a,b)=>sk==="last"?sv(b).localeCompare(sv(a)):sv(a).localeCompare(sv(b),"ja"));
 const g=state.group;if(g!=="none")rows.sort((a,b)=>gkey(a,g).localeCompare(gkey(b,g),"ja"));

  html+=`<tr class="row" tabindex="0" data-href="#/p/${p.id}/notes"><td><b>${esc(p.name)}</b><div class="small">${esc([ageNum(p.birth)!=null?ageNum(p.birth)+"歳":"",p.sex].filter(Boolean).join("・"))}</div></td>
  <td>${esc(p.careLevel||"")}<div class="small">${esc(p.residence?.type||"")}</div>${myTeam(p)?`<div><span class="pill ${myTeam(p).status==="終了"?"ms-未設定":"st-対応中"}">${esc(myTeam(p).status)}</span></div>`:""}</td>
  <td>${esc(p.doctor?.name||"")}<div class="small">${esc(p.doctor?.clinic||"")}</div></td>

  <td>${esc(p.cm?.name||"")}<div class="small">${esc(p.cm?.office||"")}</div></td>
  <td>${last[p.id]?esc(last[p.id].replace("T"," ")):""}${open[p.id]?`<div><span class="pill st-未対応">未完了${open[p.id]}</span></div>`:""}</td>
  <td>${short?`<span class="pill ms-不足">不足${short}</span>`:""}${warn?` <span class="pill ms-要注意">注意${warn}</span>`:""}</td></tr>`}
 const th=(k,n)=>`<th><button type="button" data-sort="${k}" aria-label="${n}で並べ替え">${n}${state.sortKey===k?" ▲":""}</button></th>`;
 $("#main").innerHTML=NOTICE+`<div class="toolbar">
  <label>グループ表示 <select id="grp">${Object.entries(GROUPS).map(([k,n])=>`<option value="${k}" ${k===g?"selected":""}>${n}</option>`).join("")}</select></label>

  ${allp.length||!ADMIN?"":`<button class="btn ghost" id="demo" type="button">架空のサンプルを入れる</button>`}<span class="small">${rows.length}名</span></div>
  ${rows.length?`<div style="overflow:auto"><table class="list"><thead><tr>${th("name","氏名")}${th("careLevel","介護度・住居")}${th("doctor","主治医")}${th("homeDoctor","在宅医")}${th("pharmacy","訪問薬剤師（薬局）")}${th("nursing","訪問看護")}${th("cm","ケアマネ")}${th("last","最新の連絡")}<th>医療材料</th></tr></thead><tbody>${html}</tbody></table></div>`
   :`<p class="empty">${ADMIN?"患者がまだいません。":"担当の患者がまだいません。"}右上の「患者を追加」から登録するか、下の一覧から担当登録してください。</p>`}
  ${others.length?`<details style="margin-top:16px"><summary>ほかの患者（担当登録をすると閲覧できます） ${others.length}名</summary><div class="files" style="margin-top:8px">${others.map(p=>`<div class="file"><b>${esc(p.name)}</b><a class="btn ghost sm" href="#/p/${p.id}/profile">担当登録へ</a></div>`).join("")}</div></details>`:""}`;

async function readMap(pid){const r=pid?await byPid("reads",pid):await all("reads");const m={};for(const x of r)(m[x.noteId]=m[x.noteId]||[]).push(x);return m}
function mailList(notes,pmap,cur,base,rm){
 if(!notes.length)return '<p class="empty">連絡はまだありません</p>';
 notes.sort((a,b)=>b.datetime.localeCompare(a.datetime));let day=null,h="";
 for(const n of notes){const d=n.datetime.slice(0,10);if(d!==day){day=d;h+=`<div class="day">${fmtDay(d)}</div>`}
  const pn=pmap?`${esc(pmap[n.patientId]?.name||"")} 様　`:"";const unread=!(rm[n.id]||[]).some(r=>r.memberId===ME.id);
  h+=`<a class="item${unread?" unread":""}" href="${base(n)}" aria-current="${n.id===cur}"><div class="t"><span>${unread?'<span class="dot" title="未読"></span>':""}${esc(n.datetime.slice(11,16))}　${pn}</span><span class="pill st-${esc(n.status)}">${esc(n.status)}</span></div>
  <div class="s">${esc(n.subject||"（件名なし）")}</div><div class="w">${esc(n.from||"")} → ${esc(n.to||"")}${n.fileIds?.length?"　📎"+n.fileIds.length:""}　既読${(rm[n.id]||[]).length}</div></a>`}
 return h}
async function renderNotes(p,cur){
 const notes=await byPid("notes",p.id);const files=await byPid("files",p.id);const mm=await memberMap();

 let right;
 if(cur==="new"||(n&&location.hash.endsWith("/edit")))right=noteForm(p,cur==="new"?null:n,files,mm);
 else if(n)right=noteView(p,n,files,rm,mm,todos);
 else right='<p class="empty">左の一覧から連絡を選ぶか、「新しい連絡」を作成してください。</p>';
 $("#main").innerHTML=tabs(p,"notes")+`<div class="toolbar"><a class="btn" href="#/p/${p.id}/notes/new">新しい連絡</a>
  <span class="small">未完了 ${notes.filter(x=>x.status!=="完了").length}件　全 ${notes.length}件　未読 ${notes.filter(x=>!(rm[x.id]||[]).some(r=>r.memberId===ME.id)).length}件</span></div>
  <div class="mail"><div class="mlist" aria-label="連絡の一覧">${mailList(notes,null,cur,x=>`#/p/${p.id}/notes/${x.id}`,rm)}</div><div class="mdetail">${right}</div></div>`;
 await showFootprints(p);bindNoteForm(p,n,files);bindTodoButtons();
 const ed=$("#editNote");if(ed)ed.onclick=()=>{location.hash=`#/p/${p.id}/notes/${n.id}/edit`};
 const dn=$("#delNote");if(dn)dn.onclick=async()=>{if(!confirm("この連絡を削除します。"))return;await del("notes",n.id);location.hash=`#/p/${p.id}/notes`};
 const dd=$("#doneNote");if(dd)dd.onclick=async()=>{n.status="完了";n.doneDate=n.doneDate||today();n.handler=n.handler||ME.name;await put("notes",n);toast("対応完了にしました");render()};

}

function bindNoteForm(p,n,files){const f=$("#nf");if(!f)return;

const b64=buf=>{let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

 if(pass===null)return;
 let out,name;
 if(pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(pass,salt),new TextEncoder().encode(JSON.stringify(data)));
  out=JSON.stringify({app:"renkei-techo",enc:"AES-GCM/PBKDF2-SHA256",salt:b64(salt),iv:b64(iv),data:b64(ct)});name=`renkei-techo_${today()}.rtc`}
 else{if(!confirm("暗号化せずに書き出します。患者の個人情報がそのまま読める状態になります。続けますか？"))return;out=JSON.stringify(data);name=`renkei-techo_${today()}.json`}

  if(data.app!=="renkei-techo")throw new Error("このアプリのファイルではありません");

const FOLDER={dir:null,name:"",loaded:{},
 supported:()=>"showDirectoryPicker" in window,
 async sub(name){let d=this.dir;for(const part of name.split("/"))d=await d.getDirectoryHandle(part,{create:true});return d},
 async writeJSON(dirName,file,obj){const d=dirName?await this.sub(dirName):this.dir;const fh=await d.getFileHandle(file,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(obj,null,1));await w.close()},
 async readJSON(dirName,file){try{const d=await this.sub(dirName);const fh=await d.getFileHandle(file);const f=await fh.getFile();return {obj:JSON.parse(await f.text()),mtime:f.lastModified}}catch(e){if(e.name==="NotFoundError")return null;throw e}},
 async writeAttachment(rec){const safe=rec.name.replace(/[\\/:*?"<>|]/g,"_");const d=await (await this.sub("attachments")).getDirectoryHandle(rec.patientId,{create:true});
  const fname=rec.id+"__"+safe;const fh=await d.getFileHandle(fname,{create:true});const w=await fh.createWritable();await w.write(rec.blob);await w.close();rec.path=`attachments/${rec.patientId}/${fname}`},
 async readPath(path){try{let d=this.dir;const parts=path.split("/");for(const x of parts.slice(0,-1))d=await d.getDirectoryHandle(x);const f=await (await d.getFileHandle(parts.at(-1))).getFile();return await f.arrayBuffer()}catch(e){return null}},
 async removePath(path){let d=this.dir;const parts=path.split("/");for(const x of parts.slice(0,-1))d=await d.getDirectoryHandle(x);await d.removeEntry(parts.at(-1))},
 async saveGlobal(dir,rec){if(!this.dir)return;const out={...rec};await this.writeJSON(dir,rec.id+".json",out)},
 async removeGlobal(dir,id){if(!this.dir)return;try{await (await this.sub(dir)).removeEntry(id+".json")}catch(e){}},
 async removePatient(pid){if(!this.dir)return;try{await (await this.sub("patients")).removeEntry(pid+".json")}catch(e){}try{await (await this.sub("attachments")).removeEntry(pid,{recursive:true})}catch(e){}}
};
const newer=(a,b)=>((a&&a._ts)||"")>=((b&&b._ts)||"")?a:b;
async function localBundle(pid){const files=(await byPid("files",pid)).map(f=>({...f,blob:undefined}));
 return {patient:await get("patients",pid),notes:await byPid("notes",pid),daily:await byPid("daily",pid),todos:await byPid("todos",pid),reads:await byPid("reads",pid),views:await byPid("views",pid),files,deleted:(await metaGet("del:"+pid))||{}}}
function mergeBundles(a,b){const deleted={...(a.deleted||{}),...(b.deleted||{})};for(const k in b.deleted||{})if((a.deleted||{})[k]>b.deleted[k])deleted[k]=a.deleted[k];
 const mergeList=(x=[],y=[])=>{const m={};for(const r of [...x,...y]){m[r.id]=m[r.id]?newer(m[r.id],r):r}return Object.values(m).filter(r=>!(deleted[r.id]&&deleted[r.id]>=(r._ts||"")))};
 return {patient:newer(a.patient,b.patient),notes:mergeList(a.notes,b.notes),daily:mergeList(a.daily,b.daily),todos:mergeList(a.todos,b.todos),reads:mergeList(a.reads,b.reads),views:mergeList(a.views,b.views),files:mergeList(a.files,b.files),deleted}}
async function applyBundle(pid,bd){const cur=await localBundle(pid);
 if(bd.patient)await rawPut("patients",bd.patient);
 for(const s of ["notes","daily","files","todos","reads","views"]){bd[s]=bd[s]||[];const keep=new Set(bd[s].map(r=>r.id));for(const r of cur[s])if(!keep.has(r.id))await rawDel(s,r.id);
  for(const r of bd[s]){if(s==="files"){const old=await get("files",r.id);await rawPut("files",{...r,blob:old?.blob})}else await rawPut(s,r)}}
 await metaPut("del:"+pid,bd.deleted||{})}
const syncQ=new Set();let syncT=null;
function scheduleSync(pid){if(!FOLDER.dir||!pid)return;syncQ.add(pid);clearTimeout(syncT);syncT=setTimeout(flushSync,400)}
async function flushSync(){const ids=[...syncQ];syncQ.clear();
 for(const pid of ids){try{const local=await localBundle(pid);if(!local.patient)continue;
  const remote=await FOLDER.readJSON("patients",pid+".json");let out=local;
  if(remote&&remote.obj){out=mergeBundles(local,remote.obj);if(remote.obj.savedAt>(FOLDER.loaded[pid]||"")){await applyBundle(pid,out);setTimeout(render,0)}}
  out.savedAt=iso();out.savedBy=navigator.userAgent.slice(0,60);await FOLDER.writeJSON("patients",pid+".json",{app:"renkei-techo",v:1,...out});FOLDER.loaded[pid]=out.savedAt}
 catch(e){toast("保存先フォルダに書き込めませんでした："+e.message)}}
 setStatus()}
async function pullGlobal(dir,store){const d=await FOLDER.sub(dir);for await (const [name,h] of d.entries()){if(h.kind!=="file"||!name.endsWith(".json"))continue;
  try{const r=JSON.parse(await (await h.getFile()).text());const cur=await get(store,r.id);if(!cur||(r._ts||"")>=(cur._ts||""))await rawPut(store,r)}catch(e){console.warn(name,e)}}}
async function pullAll(){if(!FOLDER.dir)return;let n=0;await pullGlobal("members","members");await pullGlobal("conferences","confs");if(ME){const m=await get("members",ME.id);if(m)ME=m}const d=await FOLDER.sub("patients");
 for await (const [name,h] of d.entries()){if(h.kind!=="file"||!name.endsWith(".json"))continue;const pid=name.slice(0,-5);
  try{const remote=JSON.parse(await (await h.getFile()).text());const local=await localBundle(pid);
   const m=local.patient?mergeBundles(local,remote):remote;await applyBundle(pid,m);FOLDER.loaded[pid]=remote.savedAt||"";n++}catch(e){console.warn(name,e)}}
 setStatus(`フォルダから${n}名分を読み込みました`);render()}
async function connectFolder(handle){FOLDER.dir=handle;FOLDER.name=handle.name;await metaPut("folder",handle);
 await FOLDER.writeJSON(null,"renkei-techo.json",{app:"renkei-techo",v:1,note:"在宅連携 連絡帳のデータフォルダ"}).catch(()=>{});
 // 既存のローカルデータも書き出す
 for(const p of await all("patients"))scheduleSync(p.id);
 for(const m of await all("members"))await FOLDER.saveGlobal("members",m);
 for(const c of await all("confs"))await FOLDER.saveGlobal("conferences",c);
 for(const f of await all("files"))if(f.blob&&!f.path){await FOLDER.writeAttachment(f);await rawPut("files",f)}
 await pullAll();$("#btnPull").hidden=false;setStatus()}
function setStatus(msg){const el=$("#storeStatus");el.textContent=FOLDER.dir?`保存先：${FOLDER.name}（共有フォルダ）`:"保存先：未接続";if(msg)toast(msg)}

/* ---- チーム画面：外部のケアチーム情報 ---- */
function extTeamSection(p,mm){const t=p.ext?.team||[];if(!t.length)return"";const inTeam=new Set((p.team||[]).map(x=>x.memberId));
 const match=x=>Object.values(mm).find(m=>x.name&&m.name.replace(/\s|　/g,"")===x.name.replace(/\s|　/g,""));
 return `<fieldset style="margin-top:12px"><legend>外部（HL7 FHIR）のケアチーム情報</legend><table class="list"><thead><tr><th>氏名</th><th>役割</th><th>所属</th><th>電話</th><th>メンバー</th></tr></thead><tbody>
 ${t.map(x=>{const m=match(x);return `<tr><td>${esc(x.name||"")}</td><td>${esc(x.role||"")}</td><td>${esc(x.org||"")}</td><td>${esc(x.phone||"")}</td><td>${m?(inTeam.has(m.id)?'<span class="small">チームに登録済み</span>':`<button class="btn ghost sm" type="button" data-xadd="${m.id}" data-role="${esc(x.role||"")}">チームに加える</button>`):'<span class="small">メンバー未登録（本人の登録が必要）</span>'}</td></tr>`}).join("")}</tbody></table>
 <p class="small">FHIRの Practitioner・PractitionerRole・Organization・CareTeam から取り込んだ情報です。氏名が一致するメンバーだけをチームに加えられます。</p></fieldset>`}
function bindExtTeam(p){document.querySelectorAll("[data-xadd]").forEach(b=>b.onclick=async()=>{const np=await get("patients",p.id);
 np.team=[...(np.team||[]),{memberId:b.dataset.xadd,role:b.dataset.role,start:today(),end:"",status:"介入中",addedBy:ME.id,addedAt:iso(),source:"FHIR"}];await put("patients",np);toast("チームに加えました");render()})}


/* ============ 起動 ============ */
openDB().then(async()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();await restoreFolder();await loadSession();render()}).catch(e=>{$("#main").innerHTML=`<p class="notice">このブラウザではデータを保存できません（${esc(e.message)}）。プライベートブラウズを解除してください。</p>`});
</script>
